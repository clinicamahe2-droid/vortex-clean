<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2236">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vortex">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="img/icone.svg">
<link rel="apple-touch-icon" href="img/icone.svg">
<meta property="og:title" content="Vortex App">
<meta property="og:description" content="Protótipo do app da Vortex Clean: agenda da equipe, fotos de antes e depois, pagamento com comprovante e painel do dono.">
<title>Vortex App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de trabalho no visual claro da marca. Equipe e cliente em coluna de celular; o dono ganha painel com barra lateral no computador e abas embaixo no celular. */
:root{
  --white:#ffffff;
  --ground:#f3f8f9;
  --line:#e2ecef;
  --foam-soft:#e4f4f6;
  --foam:#7fd0d9;
  --ink:#0f2236;
  --soft:#53657a;
  --blue:#1c5fc4;
  --blue-dark:#164c9d;
  --green:#0f7a5a;
  --amber:#b45309;
  --red:#b42318;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --text:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:20px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
img{display:block;max-width:100%}
.num{font-variant-numeric:tabular-nums}

/* Seletor de perfil do protótipo */
.demo{position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));padding-top:calc(8px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.875rem}
.demo b{font-weight:600;opacity:.75}
.seg{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:#fff;padding:6px 14px;border-radius:999px;font-weight:600}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.demo .reset{margin-left:auto;border:0;background:transparent;color:#fff;opacity:.75;text-decoration:underline;text-underline-offset:3px}

/* Coluna de celular */
.mobile{max-width:440px;margin:0 auto;min-height:calc(100% - 48px);background:var(--ground);padding:0 16px 120px;position:relative}
@media (min-width:600px){.mobile{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.apphead{display:flex;align-items:center;gap:12px;padding:18px 0 14px}
.mark{width:36px;height:36px;flex:none}
.apphead .who{display:grid;line-height:1.2}
.apphead .who small{color:var(--soft);font-size:.8125rem}
.apphead .who b{font-size:1.0625rem}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;margin-left:auto;flex:none}
.title{font-family:var(--display);font-weight:600;font-size:1.5rem;letter-spacing:-.02em;line-height:1.1;margin:6px 0 4px}
.sub{color:var(--soft)}

/* Resumo do dia da equipe */
.daybar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.daybar div{background:var(--white);border-radius:16px;padding:12px 14px;display:grid;gap:2px}
.daybar small{color:var(--soft);font-size:.8125rem}
.daybar b{font-size:1.25rem}

/* Cartões de atendimento */
.jobs{display:grid;gap:10px}
.job{all:unset;box-sizing:border-box;background:var(--white);border-radius:var(--r);padding:16px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;cursor:pointer;border:2px solid transparent;transition:border-color .2s,transform .15s}
.job:hover{border-color:var(--foam)}
.job:active{transform:scale(.99)}
.job .time{grid-row:1/3;font-weight:700;color:var(--blue);font-size:1.0625rem;padding-top:1px}
.job .what{font-weight:700}
.job .where{color:var(--soft);font-size:.9375rem;grid-column:2}
.job .price{grid-row:1;grid-column:3;font-weight:700;text-align:right}
.job .chip{grid-row:2;grid-column:3;justify-self:end}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8125rem;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-agendado{background:#eef2f5;color:var(--soft)}
.st-caminho{background:#e3ecfb;color:var(--blue)}
.st-andamento{background:#fdf0e1;color:var(--amber)}
.st-concluido{background:#e2f3ec;color:var(--green)}
.st-pendente{background:#fdf0e1;color:var(--amber)}

/* Detalhe do atendimento */
.back{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--blue);padding:16px 0 6px}
.back svg{width:20px;height:20px}
.card{background:var(--white);border-radius:var(--r);padding:18px}
.stack{display:grid;gap:10px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.kv span{color:var(--soft)}
.kv b{text-align:right}
.actions2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:14px 18px;font-weight:700;text-decoration:none;transition:background .2s,transform .15s}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.b-blue{background:var(--blue);color:#fff}
.b-blue:hover{background:var(--blue-dark)}
.b-soft{background:var(--foam-soft);color:var(--ink)}
.b-soft:hover{background:#d3eef1}
.b-green{background:var(--green);color:#fff}
.btn[disabled]{opacity:.4;pointer-events:none}
.wide{width:100%}

/* Passos do serviço */
.steps{display:grid;gap:10px;margin-top:10px}
.step{background:var(--white);border-radius:var(--r);padding:16px 18px;display:grid;gap:12px}
.step .h{display:flex;align-items:center;gap:12px}
.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--ground);color:var(--soft);font-weight:700;font-size:.875rem}
.step.done .dot{background:var(--green);color:#fff}
.step.lock{opacity:.5}
.step .h b{flex:1}
.step .h small{color:var(--soft)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--ground)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph button{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(15,34,54,.7);color:#fff;font-weight:700;line-height:1}
.add{all:unset;box-sizing:border-box;aspect-ratio:1;border-radius:14px;border:2px dashed #b9d3da;display:grid;place-items:center;text-align:center;color:var(--blue);font-weight:700;font-size:.8125rem;cursor:pointer;gap:2px;padding:6px}
.add svg{width:26px;height:26px;margin:0 auto}
.add:hover{background:var(--foam-soft)}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pay button{border:2px solid var(--line);background:var(--white);border-radius:14px;padding:10px 6px;font-weight:700}
.pay button[aria-pressed="true"]{border-color:var(--blue);background:#eef4fd;color:var(--blue)}
.field{display:grid;gap:6px}
.field label{font-weight:600;font-size:.9375rem}
.field input,.field select{border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--white);width:100%}
.field input:focus,.field select:focus{border-color:var(--blue);outline:none}
.note{font-size:.875rem;color:var(--soft)}

/* Barra fixa de ação no celular */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(243,248,249,0),var(--ground) 30%)}
.dock .btn{width:100%;max-width:408px;padding:16px}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;z-index:60;transition:opacity .25s,transform .35s cubic-bezier(.16,1,.3,1);pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* Visualizador de foto */
.viewer{position:fixed;inset:0;z-index:70;background:rgba(15,34,54,.88);display:grid;place-items:center;padding:24px}
.viewer img{max-height:80vh;border-radius:16px}
.viewer button{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;border:0;background:#fff;border-radius:999px;padding:10px 16px;font-weight:700}

/* Painel do dono */
.admin{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 48px)}
.tbl{overflow-x:auto;margin:0 -8px}
.grid2 > *,.panel,.main{min-width:0}
@media (max-width:480px){td,th{padding-left:6px;padding-right:6px}.chip{font-size:.75rem;padding:3px 8px}}
.tbl table{min-width:0}
td .price-cell,td.num{white-space:nowrap}
.side{background:var(--white);padding:22px 16px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line)}
.side .brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;font-family:var(--display);font-weight:600;font-size:1.125rem}
.side .brand small{display:block;font-family:var(--text);font-weight:500;font-size:.8125rem;color:var(--soft)}
.nav{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-weight:600;color:var(--soft);cursor:pointer}
.nav svg{width:20px;height:20px}
.nav[aria-current="page"]{background:var(--foam-soft);color:var(--ink)}
.nav .count{margin-left:auto;background:var(--amber);color:#fff;border-radius:999px;font-size:.75rem;padding:1px 8px}
.main{padding:28px clamp(16px,3vw,40px) 60px;min-width:0}
.mhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--white);border-radius:var(--r);padding:16px 18px;display:grid;gap:4px}
.kpi small{color:var(--soft);font-size:.875rem}
.kpi b{font-size:1.625rem;font-family:var(--display);font-weight:600;letter-spacing:-.02em}
.kpi.warn b{color:var(--amber)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.panel{background:var(--white);border-radius:var(--r);padding:18px 20px}
.panel h2{font-size:1.0625rem;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:.9375rem}
th{text-align:left;font-weight:600;color:var(--soft);font-size:.8125rem;padding:8px 8px}
td{padding:12px 8px;border-top:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--ground)}
.person{display:inline-flex;align-items:center;gap:8px}
.ini{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.75rem}
.bars{display:flex;align-items:flex-end;gap:12px;height:170px;padding-top:10px}
.bars div{flex:1;display:grid;gap:6px;justify-items:center;align-content:end;height:100%}
.bars i{display:block;width:100%;border-radius:8px 8px 0 0;background:#c7dbe2}
.bars i.cur{background:var(--blue)}
.bars span{font-size:.8125rem;color:var(--soft)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--white);z-index:65;box-shadow:-20px 0 50px -20px rgba(15,34,54,.35);padding:calc(20px + env(safe-area-inset-top,0px)) 22px 32px;overflow:auto;transform:translateX(100%);transition:transform .4s cubic-bezier(.16,1,.3,1)}
.drawer.on{transform:none}
.scrim{position:fixed;inset:0;background:rgba(15,34,54,.35);z-index:64;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.ba2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ba2 figure{margin:0;display:grid;gap:4px}
.ba2 figcaption{font-size:.8125rem;color:var(--soft)}
.form{display:grid;gap:12px}
.items-pick{display:grid;gap:6px}
.items-pick label{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ground);border-radius:12px;padding:10px 12px}
.items-pick input[type=number]{width:64px;border:2px solid var(--line);border-radius:10px;padding:6px 8px;text-align:center;background:#fff}
.tabs{display:none}
@media (max-width:860px){
  .admin{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:18px 16px 110px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:1fr}
  .hide-m{display:none}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--white);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
  .tabs .nav{flex:1;flex-direction:column;gap:2px;font-size:.75rem;padding:8px 4px;justify-content:center}
  .tabs .nav .count{position:absolute;margin:0;transform:translate(14px,-8px)}
  .tabs .nav{position:relative}
}

/* Cliente */
.rep-photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rep-photos figure{margin:0;position:relative;border-radius:16px;overflow:hidden;aspect-ratio:1}
.rep-photos img{width:100%;height:100%;object-fit:cover}
.rep-photos figcaption{position:absolute;left:8px;bottom:8px;background:rgba(255,255,255,.92);border-radius:999px;padding:3px 10px;font-size:.8125rem;font-weight:700}
.empty{background:var(--white);border-radius:var(--r);padding:28px 22px;text-align:left;display:grid;gap:8px}
.fade{animation:fade .35s cubic-bezier(.16,1,.3,1)}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="demo" role="region" aria-label="Protótipo">
  <b>Protótipo · ver como</b>
  <div class="seg" role="group" aria-label="Perfil">
    <button type="button" data-role="equipe" aria-pressed="true">Equipe</button>
    <button type="button" data-role="dono" aria-pressed="false">Dono</button>
    <button type="button" data-role="cliente" aria-pressed="false">Cliente</button>
  </div>
  <button type="button" class="reset" id="reset">Reiniciar demonstração</button>
</div>

<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>

<script>
(function(){
  'use strict';
  var KEY='vortex-app-v2';
  var PRICES={'Sofá 2 lugares':180,'Sofá 3 lugares':240,'Sofá retrátil ou de canto':320,'Poltrona':90,'Cadeira':35,'Colchão solteiro':140,'Colchão casal':190,'Bancos de carro':220,'Teto e carpete do carro':160};
  var TEAM={c:{name:'Carlos',full:'Carlos Mendes',tint:'#dce9fb',ink:'#1c5fc4'},d:{name:'Diego',full:'Diego Rocha',tint:'#dff3ec',ink:'#0f7a5a'}};
  var STATUS={agendado:'Agendado',caminho:'A caminho',andamento:'Em andamento',concluido:'Concluído',pendente:'Pendente'};

  function seed(){
    return {jobs:[
      {id:'j1',time:'09:00',team:'c',client:'Ana Paula Martins',phone:'(48) 99900-0001',address:'Rua das Acácias, 120 · Centro, Criciúma',items:[['Sofá 3 lugares',1],['Poltrona',2]],status:'concluido',checkin:'08:57',before:['img/sofa-sujo.jpg'],after:['img/sofa.jpg'],pay:{method:'Pix',value:420,receipt:'img/comprovante.svg',at:'10:52'}},
      {id:'j2',time:'13:30',team:'c',client:'Marcos Lima',phone:'(48) 99900-0002',address:'Rua Ipê Roxo, 45 · Pinheirinho, Criciúma',items:[['Bancos de carro',1]],status:'caminho',before:[],after:[],pay:null},
      {id:'j3',time:'16:00',team:'c',client:'Júlia Ramos',phone:'(48) 99900-0003',address:'Av. Centenário, 980 · Centro, Içara',items:[['Colchão casal',1]],status:'agendado',before:[],after:[],pay:null},
      {id:'j4',time:'10:00',team:'d',client:'Clínica Bem Estar',phone:'(48) 99900-0004',address:'Rua Coronel Pedro Benedet, 300 · Centro, Criciúma',items:[['Cadeira',6],['Sofá 3 lugares',1]],status:'pendente',checkin:'09:55',before:['img/sofa-sujo.jpg'],after:['img/sofa.jpg'],pay:{method:'Cartão',value:450,receipt:false,at:'11:40'}},
      {id:'j5',time:'15:00',team:'d',client:'Apartamento Airbnb 302',phone:'(48) 99900-0005',address:'Rua Pascoal Meller, 75 · Próspera, Criciúma',items:[['Sofá retrátil ou de canto',1]],status:'agendado',before:[],after:[],pay:null}
    ],month:[1980,2640,2910,2330],role:'equipe'};
  }
  var S;
  try{S=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){S=seed()}
  var save=function(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Sem espaço para salvar fotos neste navegador')}};
  var total=function(j){return j.items.reduce(function(s,it){return s+(PRICES[it[0]]||0)*it[1]},0)};
  var brl=function(v){return 'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:0})};
  var brl2=function(v){return 'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})};
  var desc=function(j){return j.items.map(function(it){return (it[1]>1?it[1]+'× ':'')+it[0]}).join(' + ')};
  var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var chip=function(st){return '<span class="chip st-'+st+'">'+STATUS[st]+'</span>'};
  var now=function(){var d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
  var byTime=function(a,b){return a.time.localeCompare(b.time)};
  var app=document.getElementById('app');

  }

  function donoServicos(){

  function donoFinanceiro(){

    var cur=m[3]+todayPaid,arr=[m[0],m[1],m[2],cur],max=Math.max.apply(null,arr),sum=arr.reduce(function(a,b){return a+b},0);

  // ---------- Render ----------
  var lastKey="";
  function render(){
    document.querySelectorAll('.seg button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.role===S.role)});
    if(S.role==='equipe'){var j=view.equipe.job&&S.jobs.find(function(x){return x.id===view.equipe.job});app.innerHTML=j?equipeJob(j):equipeHome()}
    else if(S.role==='dono'){var t=view.dono.tab;app.innerHTML=donoShell(t==='servicos'?donoServicos():t==='financeiro'?donoFinanceiro():t==='novo'?donoNovo():donoHoje())+'<div class="scrim" id="scrim"></div><aside class="drawer" id="drawer" aria-label="Detalhe do atendimento"></aside>'}
    else app.innerHTML=clienteHome();
    if(S.role==='dono'&&view.dono.tab==='novo')bindNovo();
    // Só anima a entrada quando muda de tela, não a cada ação
    var key=S.role+'|'+(view.equipe.job||'')+'|'+view.dono.tab;
    if(key===lastKey)app.querySelectorAll('.fade').forEach(function(el){el.classList.remove('fade')});
    lastKey=key;
  }

  function openDrawer(id){var j=S.jobs.find(function(x){return x.id===id});if(!j)return;var d=document.getElementById('drawer'),s=document.getElementById('scrim');d.innerHTML=donoDetail(j);requestAnimationFrame(function(){d.classList.add('on');s.classList.add('on')})}
  function closeDrawer(){var d=document.getElementById('drawer'),s=document.getElementById('scrim');if(d){d.classList.remove('on');s.classList.remove('on')}}

  function bindNovo(){
    var f=document.getElementById('newjob'),tot=document.getElementById('n-total');
    var calc=function(){var t=0;f.querySelectorAll('[data-item]').forEach(function(i){t+=(PRICES[i.dataset.item]||0)*(+i.value||0)});tot.textContent=brl(t);return t};
    f.addEventListener('input',calc);
    f.addEventListener('submit',function(e){e.preventDefault();var items=[];f.querySelectorAll('[data-item]').forEach(function(i){if(+i.value>0)items.push([i.dataset.item,+i.value])});
      if(!items.length){toast('Escolha pelo menos um item do orçamento');return}
      var job={id:'j'+Date.now(),time:document.getElementById('n-time').value,team:document.getElementById('n-team').value,client:document.getElementById('n-client').value.trim(),phone:'(48) 99900-0000',address:document.getElementById('n-addr').value.trim(),items:items,status:'agendado',before:[],after:[],pay:null};
      S.jobs.push(job);save();toast('Enviado para a agenda de '+TEAM[job.team].name);view.dono.tab='hoje';render()});
  }

  // Foto: reduz no aparelho antes de guardar
  var shotTarget=null,cam=document.getElementById('cam');
  function shrink(file,cb){var r=new FileReader();r.onload=function(){var img=new Image();img.onload=function(){var s=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};img.onerror=function(){toast('Não foi possível ler essa imagem')};img.src=r.result};r.readAsDataURL(file)}
  cam.addEventListener('change',function(){var f=cam.files&&cam.files[0];if(!f||!shotTarget)return;var j=S.jobs.find(function(x){return x.id===view.equipe.job});var kind=shotTarget;shrink(f,function(data){
    if(kind==='receipt'){j.pay=j.pay||{method:'Pix',value:total(j)};j.pay.receipt=data;j.pay.at=now();toast('Comprovante anexado')}
    else{j[kind].push(data);if(j.status==='caminho'||j.status==='agendado')j.status='andamento';toast(kind==='before'?'Foto antes salva':'Foto depois salva')}
    save();render()});cam.value=''});

  document.addEventListener('click',function(e){
    var t=e.target.closest('button,a,img,tr');if(!t)return;
    if(t.dataset.role){S.role=t.dataset.role;view.equipe.job=null;save();render();scrollTo(0,0);return}
    if(t.id==='reset'){S=seed();try{localStorage.removeItem(KEY)}catch(x){}view={equipe:{job:null},dono:{tab:'hoje'},cliente:{}};render();toast('Demonstração reiniciada');return}
    if(t.dataset.open){view.equipe.job=t.dataset.open;render();scrollTo(0,0);return}
    if(t.hasAttribute('data-home')){view.equipe.job=null;render();return}
    var j=view.equipe.job&&S.jobs.find(function(x){return x.id===view.equipe.job});
    if(t.hasAttribute('data-checkin')&&j){j.checkin=now();if(j.status!=='andamento')j.status='andamento';save();render();toast('Chegada marcada às '+j.checkin);return}
    if(t.dataset.shot&&j){shotTarget=t.dataset.shot;cam.click();return}
    if(t.dataset.del&&j){var p=t.dataset.del.split(':');j[p[0]].splice(+p[1],1);save();render();return}
    if(t.dataset.method&&j){var v=parseFloat((document.getElementById('pv')||{}).value)||total(j);j.pay=j.pay||{value:v,receipt:false};j.pay.method=t.dataset.method;j.pay.value=v;j.pay.at=j.pay.at||now();save();render();return}
    if(t.hasAttribute('data-finish')&&j){var pv=document.getElementById('pv');if(pv)j.pay.value=parseFloat(pv.value.replace(',','.'))||j.pay.value;j.status='concluido';save();render();toast('Enviado ao dono e ao cliente');return}
    if(t.dataset.tab){view.dono.tab=t.dataset.tab;render();scrollTo(0,0);return}
    if(t.dataset.detail){openDrawer(t.dataset.detail);return}
    if(t.hasAttribute('data-close')){closeDrawer();return}
    if(t.dataset.ask){toast('Lembrete enviado para a equipe');return}
    if(t.dataset.view){var v2=document.createElement('div');v2.className='viewer';v2.innerHTML='<img src="'+t.dataset.view+'" alt="Foto ampliada"><button type="button">Fechar</button>';v2.addEventListener('click',function(){v2.remove()});document.body.appendChild(v2);return}
  });
  document.addEventListener('click',function(e){if(e.target.id==='scrim')closeDrawer()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeDrawer();var v=document.querySelector('.viewer');if(v)v.remove()}});
  document.addEventListener('change',function(e){if(e.target.id==='pv'){var j=S.jobs.find(function(x){return x.id===view.equipe.job});if(j&&j.pay){j.pay.value=parseFloat(e.target.value.replace(',','.'))||j.pay.value;save()}}});

  render();
})();
</script>
</body>
</html>
